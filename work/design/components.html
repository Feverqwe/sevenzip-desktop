<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sevenzip · компоненты</title>
<style>
:root{color-scheme:light dark;font:13px system-ui,-apple-system,sans-serif;background:light-dark(#f5f5f7,#202022);color:light-dark(#1d1d1f,#f2f2f5)}
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:7px 12px;border-bottom:1px solid light-dark(#c9c9cf,#48484d);flex:none}
button,select{font:inherit;padding:4px 8px;border:1px solid light-dark(#c9c9cf,#48484d);border-radius:5px;background:light-dark(#fff,#333336);color:inherit}button{cursor:pointer}a{color:light-dark(#0068d9,#69adff)}label{margin-left:auto;white-space:nowrap}iframe{width:100%;flex:1;min-height:0;border:0}
</style>
<header>
<button id="catalog" type="button">Компоненты Sevenzip</button>
<a href="index.html?review=components-v38#main">Окна</a>
<a href="specs/design-system.md" target="_blank" aria-label="Контракты компонентов и соответствие Qt">Qt ↗</a>
<label>Тема <select id="scheme"><option value="system">Как в системе</option><option value="light">Светлая</option><option value="dark">Тёмная</option></select></label>
</header>
<iframe id="preview" src="sevenzip-preview.html?review=components-v38" title="Живой каталог компонентов Sevenzip"></iframe>
<script>
const preview=document.getElementById('preview'),scheme=document.getElementById('scheme');
function send(message){preview.contentWindow.postMessage(message,location.origin)}
function showCatalog(){send({type:'sevenzip-design-navigate',screen:'components'})}
function showTheme(){send({type:'sevenzip-design-theme',scheme:scheme.value});document.documentElement.style.colorScheme=scheme.value==='system'?'light dark':scheme.value}
document.getElementById('catalog').onclick=showCatalog;scheme.onchange=showTheme;
preview.onload=()=>{showCatalog();showTheme()};
window.addEventListener('message',e=>{if(e.origin==='null'&&e.data?.type==='sevenzip-design-ready'){showCatalog();showTheme()}});
</script>
</html>
