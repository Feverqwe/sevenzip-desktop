<script>
(()=>{
 const root=document.getElementById('sevenzip-design');
 function reviewStateNavigation(pickerClass,options='',hidden=false){
  return `<div class="state-nav" ${hidden?'hidden':''}><button type="button" class="btn" data-state-step="-1" aria-label="Предыдущее состояние" title="Предыдущее состояние" disabled>←</button><label class="form-label">Состояние <select class="form-select ${pickerClass}">${options}</select></label><button type="button" class="btn" data-state-step="1" aria-label="Следующее состояние" title="Следующее состояние" disabled>→</button></div>`;
 }
 function adjacentReviewState(picker,step){
  for(let index=picker.selectedIndex+step;index>=0&&index<picker.options.length;index+=step){
   if(!picker.options[index].disabled)return index;
  }
  return -1;
 }
 function syncReviewStateNavigation(picker){
  picker.closest('.state-nav').querySelectorAll('[data-state-step]').forEach(button=>{
   button.disabled=adjacentReviewState(picker,Number(button.dataset.stateStep))<0;
  });
 }
 function bindReviewStateNavigation(picker){
  const navigation=picker.closest('.state-nav');
  navigation.querySelectorAll('[data-state-step]').forEach(button=>button.addEventListener('click',()=>{
   const index=adjacentReviewState(picker,Number(button.dataset.stateStep));
   if(index<0)return;
   const variant=button.closest('[data-variant]');
   const hadFocus=document.activeElement===button;
   picker.selectedIndex=index;
   picker.dispatchEvent(new Event('change',{bubbles:true}));
   if(hadFocus&&!variant.hidden&&[button,document.body].includes(document.activeElement)){
    const next=variant.querySelector(`[data-state-step="${button.dataset.stateStep}"]`);
    (next?.disabled?variant.querySelector('.state-nav select'):next)?.focus();
   }
  }));
  syncReviewStateNavigation(picker);
 }
 window.addEventListener('message',e=>{if(e.data?.type==='sevenzip-design-theme'&&['light','dark','system'].includes(e.data.scheme)){const scheme=e.data.scheme==='system'?'light dark':e.data.scheme;root.style.setProperty('--review-color-scheme',scheme);root.style.colorScheme=scheme;document.documentElement.style.colorScheme=scheme}});
 const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
 const btn=(text,ico='',extra='',props={})=>`<button type="button" class="product-button cursor-interaction ${extra}"${props.disabled?' disabled':''}${props.label?` aria-label="${htmlText(props.label)}"`:''}>${ico?icon(ico):''}${htmlText(text)}</button>`;
 const formField=(label,control)=>`<label class="field"><span>${htmlText(label)}</span>${control}</label>`;
 const productSelect=(label,value,options)=>`<select class="product-select" aria-label="${htmlText(label)}">${options.map(x=>`<option${x===value?' selected':''}>${htmlText(x)}</option>`).join('')}</select>`;
 const field=(label,value,options)=>formField(label,options?productSelect(label,value,options):`<input class="product-input" value="${htmlText(value)}">`);
 const check=(label,on=false,className='')=>`<label class="check ${className}"><input type="checkbox" ${on?'checked':''}><span>${label}</span></label>`;
 const actionBar=({actions=[],leading='',className='footer'}={})=>`<div class="${className}">${leading}${actions.map(action=>btn(action.label,action.icon||'',action.className||'',action)).join('')}</div>`;
 const footer=()=>actionBar({actions:[{label:'Отмена'},{label:'ОК',className:'primary'}]});
 const dialog=(title,body,narrow=false,options={})=>`<div class="dialog-stage"><div class="dialog ${narrow?'narrow':''}${options.className?' '+options.className:''}"><div class="dialog-title">${htmlText(title)}</div><div class="content">${body}</div>${options.actions??footer()}</div></div>`;
 const disclosure=({label,body,open=false,className=''}={})=>`<details class="mac-disclosure ${className}" ${open?'open':''}><summary>${icon('chevron-right')}${htmlText(label)}</summary>${body}</details>`;
 const metadataRows=(rows,{rowClass=''}={})=>`<dl class="metadata-list">${rows.map(([label,value])=>`<div class="metadata-row ${rowClass}"><dt>${htmlText(label)}</dt><dd>${htmlText(value)}</dd></div>`).join('')}</dl>`;

 const sourceSummary=({name,path,fullPath,detail,iconName='file',className=''})=>`<div class="source-summary ${className}" title="${htmlText(fullPath||path||name)}">${iconName?icon(iconName):''}<div><strong>${htmlText(name)}</strong>${detail?`<span class="hint">${htmlText(detail)}</span>`:''}</div></div>`;
 const systemPathField=(label,value,{className='',kind='folder'}={})=>`<label class="field"><span>${htmlText(label)}</span><span class="inputrow"><input class="product-input ${className}" value="${htmlText(value)}"><button type="button" class="product-button" data-system-picker="${kind}">Выбрать…</button></span></label>`;

 files.push(['Договор.pdf','840 КБ','PDF','file-text'],['План работ.docx','64 КБ','Документ','file-text'],['Макет.png','2,1 МБ','Изображение','image'],['Обложка.jpg','640 КБ','Изображение','image'],['Демонстрация.mp4','18 МБ','Видео','film'],['Настройки.json','1,8 КБ','JSON','file-code'],['Пример.cpp','4,2 КБ','C++','file-code'],['Изменения.md','3,6 КБ','Markdown','file-text'],['Смета.xlsx','48 КБ','Таблица','file-spreadsheet'],['Read me — 日本語.txt','2 КБ','Текст','file-text']);

 function fileArtwork(name,kind){
  const svg=body=>`<svg viewBox="0 0 80 80" aria-hidden="true">${body}</svg>`;
  if(kind==='Том')return icon('hard-drive');
  if(kind==='Папка')return svg('<path d="M5 22a5 5 0 0 1 5-5h21l7 7h32a5 5 0 0 1 5 5v34H5Z" fill="#319ed8"/><path d="M8 27h64v31H8Z" fill="#b9e6fa"/><path d="M4 34a4 4 0 0 1 4-4h64a4 4 0 0 1 4 4l-3 29a5 5 0 0 1-5 4H12a5 5 0 0 1-5-4Z" fill="#67c5ee"/><path d="M8 31h64" stroke="#a2e1fa" stroke-width="2"/>');
  if(kind==='Изображение'||kind==='Видео')return svg(`<rect x="3" y="13" width="74" height="54" rx="2" fill="#fff" stroke="#c4c9cf"/><path d="M7 17h66v46H7Z" fill="${name.endsWith('.jpg')?'#e9d7c1':'#b9d9ea'}"/><circle cx="56" cy="29" r="7" fill="#fff0bc"/><path d="m7 56 22-27 20 25 12-15 12 17v7H7Z" fill="#7d9f9b"/><path d="m7 60 32-17 34 20H7Z" fill="#466e75"/>${kind==='Видео'?'<circle cx="40" cy="40" r="13" fill="#172b3dbb"/><path d="m37 32 11 8-11 8Z" fill="white"/>':''}`);
  const ext=name.includes('.')?name.split('.').pop().toUpperCase().slice(0,4):'',archive=kind.startsWith('Архив'),color=archive?'#a37b42':ext==='PDF'?'#ca514c':['CSV','XLSX'].includes(ext)?'#38876a':ext==='DOCX'?'#427cc0':['JSON','CPP'].includes(ext)?'#7568a8':'#758494';
  return `<span class="file-document ${archive?'archive':''}" style="--file-color:${color}" aria-hidden="true">${ext?`<b>${htmlText(ext)}</b>`:''}</span>`;
 }

 const fileDisplayLocale=()=>navigator.languages?.length?navigator.languages:undefined;
 function fixtureSizeBytes(label){if(!label)return '';const n=Number(label.replace(/\s/g,'').replace(',','.').match(/^[\d.]+/)?.[0]);if(!Number.isFinite(n))return '';const units=['Б','КБ','МБ','ГБ','ТБ'],unit=label.trim().split(/\s+/).at(-1),power=units.indexOf(unit);return power<0?'':String(Math.round(n*1024**power))}
 function fixtureModifiedEpoch(label){if(!label)return '';if(label==='Только что')return String(Date.now());const m=label.match(/^(\d{2})\.(\d{2})\.(\d{4}) (\d{2}):(\d{2})$/);return m?String(new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]).getTime()):''}
 function readableFileSize(bytes,{exact=false}={}){if(bytes===''||bytes===undefined||!Number.isFinite(Number(bytes))||Number(bytes)<0)return '—';let value=Number(bytes),power=0;if(!exact)while(value>=1024&&power<4){value/=1024;power++}return new Intl.NumberFormat(fileDisplayLocale(),{style:'unit',unit:['byte','kilobyte','megabyte','gigabyte','terabyte'][power],unitDisplay:'short',maximumFractionDigits:power?1:0}).format(value)}
 function readableFileDate(epoch,{full=false}={}){if(epoch===''||epoch===undefined||!Number.isFinite(Number(epoch)))return '—';const date=new Date(Number(epoch));if(!Number.isFinite(date.getTime()))return '—';return new Intl.DateTimeFormat(fileDisplayLocale(),{dateStyle:full?'long':'short',timeStyle:full?'long':'short'}).format(date)}
 function fileMetadata(bytes,epoch){return ` data-bytes="${bytes??''}" data-modified-epoch="${epoch??''}"`}
 function localizeFileItem(item){
  const iconItem=item.classList.contains('icon-item'),size=item.dataset.sizeLabel??item.querySelector('td:nth-child(2)')?.textContent??'',date=item.dataset.modified??item.querySelector('.datecol')?.textContent??'';
  if(!item.hasAttribute('data-bytes'))item.dataset.bytes=fixtureSizeBytes(size);
  if(!item.hasAttribute('data-modified-epoch'))item.dataset.modifiedEpoch=fixtureModifiedEpoch(date);
  const sizeText=['Папка','Том'].includes(item.dataset.kind)&&item.dataset.bytes===''?'':readableFileSize(item.dataset.bytes),dateText=readableFileDate(item.dataset.modifiedEpoch);
  item.dataset.sizeLabel=sizeText;item.dataset.modified=dateText;
  if(!iconItem){const sizeCell=item.children[1],dateCell=item.children[3];if(sizeCell){sizeCell.textContent=sizeText;sizeCell.title=readableFileSize(item.dataset.bytes,{exact:true})}if(dateCell){dateCell.textContent=dateText;dateCell.title=readableFileDate(item.dataset.modifiedEpoch,{full:true})}}
 }

 function iconCard(name,size,kind,selected=false,modified='',{focused=false,cut=false,bytes,modifiedEpoch}={}){return `<div class="icon-item ${selected?'selected':''} ${focused?'file-item current-file':''} ${cut?'pending-cut':''}" data-file="${htmlText(name)}" data-size-label="${htmlText(size)}" data-kind="${htmlText(kind)}" data-modified="${htmlText(modified)}"${fileMetadata(bytes??fixtureSizeBytes(size),modifiedEpoch??fixtureModifiedEpoch(modified))}><span class="file-art" aria-hidden="true">${fileArtwork(name,kind)}</span><span class="file-caption" title="${htmlText(name)}">${htmlText(name)}</span></div>`}
 function fileRow({name,size='',kind='',modified='',symbol='file',selected=false,focused=false,cut=false}){const bytes=fixtureSizeBytes(size),epoch=fixtureModifiedEpoch(modified),displaySize=bytes===''&&['Папка','Том'].includes(kind)?'':readableFileSize(bytes);return `<tr class="cursor-interaction ${selected?'selected':''} ${focused?'file-item current-file':''} ${cut?'pending-cut':''}" data-file="${htmlText(name)}" data-kind="${htmlText(kind)}"${fileMetadata(bytes,epoch)}><td><span class="filename">${icon(symbol)}${htmlText(name)}</span></td><td title="${htmlText(readableFileSize(bytes,{exact:true}))}">${htmlText(displaySize)}</td><td class="typecol">${htmlText(kind)}</td><td class="datecol" title="${htmlText(readableFileDate(epoch,{full:true}))}">${htmlText(readableFileDate(epoch))}</td></tr>`}
 function addressContent(value,{editing=false}={}){const parts=value.split(' / ').filter(Boolean);return `<span class="breadcrumbs" ${editing?'hidden':''}>${parts.map((part,i)=>`${i?'<span class="crumb-separator">›</span>':''}<button type="button" class="crumb ${/\.(7z|zip)$/i.test(part)?'is-archive':''}" data-main-crumb="${htmlText(parts.slice(0,i+1).join(' / '))}" ${/\.(7z|zip)$/i.test(part)?`aria-label="Архив «${htmlText(part)}»"`:''}>${/\.(7z|zip)$/i.test(part)?icon('archive')+`<span>${htmlText(part)}</span>`:htmlText(part)}</button>`).join('')}</span><input class="path-editor" value="${htmlText(value)}" ${editing?'':'hidden'} aria-label="Полный путь"><button type="button" class="edit-main-path" aria-label="Редактировать путь">${icon('pencil')}</button>`}
 function managerStatus({summary='',size=''}={}){return `<div class="status manager-status" role="status" aria-label="Состояние активной панели" aria-atomic="true"><span data-selection>${htmlText(summary)}</span><span data-selection-size>${htmlText(size)}</span></div>`}
 function pane(second=false){return `<div class="pane"><div class="address">${btn('','arrow-up') }<div class="path">${icon(second?'archive':'folder')}<span>${second?'Проект.7z /':'Домашняя / Документы / Проект'}</span>${icon('chevron-down')}</div></div><table class="filetable"><thead><tr><th>Имя ↑</th><th>Размер</th><th class="typecol">Тип</th><th class="datecol">Изменён</th></tr></thead><tbody>${files.map((r,i)=>fileRow({name:r[0],size:r[1],kind:r[2],symbol:r[3],modified:i?'18.10.2026 12:40':'',selected:i===4})).join('')}</tbody></table><div class="filespace"></div></div>`}
 const toolButton=(label,name,showText=false,shortcut='')=>`<button type="button" class="product-button cursor-interaction" data-command="${label}" aria-label="${label}" data-tooltip="${label}${shortcut?' · '+shortcut:''}">${icon(name)}${showText?`<span>${label}</span>`:''}</button>`;
 const fileCommands=(availability={})=>[['create','Создать папку','folder-plus'],['cut','Вырезать','scissors'],['copy','Копировать','copy'],['paste','Вставить','clipboard-paste'],['rename','Переименовать','text-cursor-input'],['delete','Удалить','trash-2']].map(([command,label,symbol])=>`<button type="button" class="product-button file-command" data-main-command="${command}" aria-label="${label}" data-tooltip="${label}" ${availability[command]===false?'disabled':''}>${icon(symbol)}<span class="file-command-label">${label}</span></button>`).join('');

   <label class="field"><span>Действие</span><select class="product-select archive-update-mode"><option value="add">Добавить и заменить</option><option value="update">Добавить новые и более свежие</option><option value="fresh">Обновить только существующие</option></select></label>

  if(globalThis.Tweak){const tweak=new Tweak({container:product,onChange:()=>{geometry();save()}});tweak.addSlider(state,'margin',{label:'Край окна',min:8,max:32,step:4,unit:'px'});tweak.addSlider(state,'row',{label:'Строка списка',min:24,max:40,step:2,unit:'px'});tweak.addSlider(state,'radius',{label:'Скругление полей',min:0,max:8,step:1,unit:'px'})}
  observeGlobal(window,'openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.modelContent;if(activeReviewWindow!==windowId||!screenNames.some(x=>x[0]===s?.screen))return;inheritView({screen:s.screen,two:!!s.two})});
 }
 root.querySelectorAll('[data-variant]').forEach((variant,index)=>mountVariant(variant,index));
})();
</script>
